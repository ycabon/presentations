<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>1.update-definition-expression</title>

    <!-- Load Calcite -->
    <script
      type="module"
      src="https://js.arcgis.com/calcite-components/3.0.3/calcite.esm.js"
    ></script>

    <!-- Load the ArcGIS Maps SDK for JavaScript core API -->
    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.32/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.32/"></script>

    <!-- Load map components -->
    <script
      type="module"
      src="https://js.arcgis.com/map-components/4.32/arcgis-map-components.esm.js"
    ></script>

    <style>
      #histogram {
        width: 500px;
        height: 150px;
      }

      .labels {
        padding: 5px;
      }

      html,
      body {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }

      .application-container {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .application-container arcgis-map {
        flex: 1;
      }

      .application-container calcite-slider {
        flex: 0;
        margin: 24px;
      }
    </style>

    <script>
      require(["esri/WebMap"], (WebMap) =>
        (async () => {
          // https://jsapi.maps.arcgis.com/apps/mapviewer/index.html?webmap=4b0901f42a9d4006b0fd847555f693dc
          // layers:
          //   - Global Temperatures from 1880 to 2018 by row
          //   - Global Temperature anomalies by row
          const map = new WebMap({
            portalItem: {
              id: "4b0901f42a9d4006b0fd847555f693dc",
            },
          });

          await map.load();
          map.layers.forEach((layer) => (layer.visible = false));

          // Set initial temperature anomaly renderer on layer based
          // on data recorded for the year 1880
          const layer = map.layers.find(
            (layer) =>
              layer.title === "Global Temperatures from 1880 to 2018 by row"
          );

          layer.visible = true;
          layer.outFields = ["*"];

          // Configure the map element to display the map
          const mapElement = document.querySelector("#mapElement");
          mapElement.constraints = { snapToZoom: false };
          mapElement.map = map;

          // When the user changes the slider's value,
          // change the renderer and histogram to reflect
          // data corresponding to the year indicated on the slider
          const slider = document.querySelector("#yearSlider");
          slider.addEventListener("calciteSliderChange", (event) => {
            const year = event.target.value;
            setYear(year);
          });

          function setYear(value) {
            slider.value = value;
            // Update the underlying data value driving the expression
            // based on the given year provided by the slider
            layer.definitionExpression = `YEAR = ${value}`;
          }

          setYear(1880);
        })());
    </script>
  </head>

  <body>
    <div class="application-container">
      <arcgis-map id="mapElement" popup-disabled>
        <arcgis-zoom position="top-left"></arcgis-zoom>
      </arcgis-map>
      <!-- This slider will allow the user to update the renderer based on a provided year between 1880 and 2018 -->
      <calcite-slider
        id="yearSlider"
        value="1880"
        precise
        label-ticks
        label-handles
        fill-placement="none"
        max="2018"
        min="1880"
        scale="l"
        ticks="20"
      >
      </calcite-slider>
    </div>
  </body>
</html>
