<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>4.star-outfields</title>

    <!-- Load Calcite -->
    <script
      type="module"
      src="https://js.arcgis.com/calcite-components/3.0.3/calcite.esm.js"
    ></script>

    <!-- Load the ArcGIS Maps SDK for JavaScript core API -->
    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.32/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.32/"></script>

    <!-- Load map components -->
    <script
      type="module"
      src="https://js.arcgis.com/map-components/4.32/arcgis-map-components.esm.js"
    ></script>

    <link rel="stylesheet" href="./style.css" />

    <script>
      require(["esri/WebMap"], (WebMap) =>
        (async () => {
          // https://jsapi.maps.arcgis.com/apps/mapviewer/index.html?webmap=4b0901f42a9d4006b0fd847555f693dc
          // layers:
          //   - Long table: Global Temperatures from 1880 to 2018 by row
          //   - Wide table: Global Temperature anomalies by column
          const map = new WebMap({
            portalItem: {
              id: "4b0901f42a9d4006b0fd847555f693dc",
            },
          });

          await map.load();
          map.layers = map.layers.filter(
            (layer) => layer.title === "Global Temperature anomalies by column"
          );
          const layer = map.layers.at(0);

          layer.visible = true;
          layer.definitionExpression = null;

          // Set the outFields property to ["*"] to request all fields.
          // This will allow faster updates to the renderer when switching years.
          layer.outFields = ["*"];

          // Configure the map element to display the map
          const mapElement = document.querySelector("#mapElement");
          mapElement.constraints = { snapToZoom: false };
          mapElement.map = map;

          const layerView = await mapElement.whenLayerView(layer);

          // Update the year filter based on the slider input
          const slider = document.querySelector("#yearSlider");
          slider.addEventListener("calciteSliderInput", (event) => {
            const year = event.target.value;
            setYear(year);
          });

          // let's print to the renderer to help us understand which properties to update
          console.log(layer.renderer.toJSON());

          async function setYear(value) {
            slider.value = value;

            // Update the field used by the renderer and its visual variables
            renderer = layer.renderer.clone();
            renderer.field = `_${value}`;
            renderer.visualVariables.forEach((variable) => {
              variable.field = `_${value}`;
            });
            layer.renderer = renderer;
          }

          setYear(1880);
        })());
    </script>
  </head>

  <body>
    <div class="application-container">
      <arcgis-map id="mapElement" popup-disabled>
        <arcgis-zoom position="top-left"></arcgis-zoom>
      </arcgis-map>
      <!-- This slider will allow the user to update the renderer based on a provided year between 1880 and 2018 -->
      <calcite-slider
        id="yearSlider"
        value="1880"
        precise
        label-ticks
        label-handles
        fill-placement="none"
        max="2018"
        min="1880"
        scale="l"
        ticks="20"
      >
      </calcite-slider>
    </div>
  </body>
</html>
