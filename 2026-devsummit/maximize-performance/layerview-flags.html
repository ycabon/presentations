<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>
      Scale-dependent DisplayFilter | Sample | ArcGIS Maps SDK for JavaScript
    </title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.0/"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #panel {
        max-height: fit-content;
        width: 280px;
      }

      #flagContainer {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
      }

      .flag-name {
        font-weight: 500;
        color: var(--calcite-color-text-1, #2b2b2b);
      }

      .flag-value {
        font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono",
          monospace;
      }

      #transitionHeader {
        margin-top: 10px;
      }

      #transitionControls {
        display: flex;
        justify-content: flex-end;
        margin: 6px 0;
      }

      #transitionList {
        margin: 0;
        padding-left: 20px;
        max-height: 160px;
        overflow: auto;
        font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono",
          monospace;
        font-size: 12px;
        list-style-type: none;
      }

      #transitionList li {
        margin-bottom: 2px;
      }

      #transitionList li.latest {
        animation: flashIn 700ms ease-out;
      }

      #transitionList li.row-true {
        color: #1f7a3d;
      }

      #transitionList li.row-false {
        color: #c0342a;
      }

      @keyframes flashIn {
        from {
          background: rgba(255, 214, 10, 0.35);
        }
        to {
          background: transparent;
        }
      }
    </style>
  </head>

  <body>
    <calcite-shell>
      <arcgis-map>
        <arcgis-zoom slot="top-left"></arcgis-zoom>
        <calcite-panel heading="LayerView Flags" id="panel" slot="top-right">
          <div style="padding: 12px">
            <calcite-label
              >Created_Date Filter
              <arcgis-slider
                range-labels-placement="end"
                value-labels-placement="start"
                value-labels-display="auto"
                style="height: auto"
                layout="horizontal"
                show-range-labels
              >
                <arcgis-histogram
                  slot="content-start"
                  color-blending-enabled
                  style="width: 242px; height: 60px"
                  min="7500"
                  max="200001"
                  layout="horizontal"
                ></arcgis-histogram>
              </arcgis-slider>
            </calcite-label>
            <calcite-label>
              Features on layer
              <calcite-input
                id="layerFeatureCount"
                read-only
                value="--"
              ></calcite-input>
            </calcite-label>
            <calcite-label>
              Features in memory
              <calcite-input
                id="featureCount"
                read-only
                value="--"
              ></calcite-input>
            </calcite-label>
            <calcite-label>LayerView status</calcite-label>
            <div id="flagContainer">
              <span class="flag-name">hasAllFeatures</span>
              <calcite-input
                class="flag-value"
                id="flag-hasAllFeatures"
                read-only
                value="--"
              ></calcite-input>

              <span class="flag-name">hasAllFeaturesInView</span>
              <calcite-input
                class="flag-value"
                id="flag-hasAllFeaturesInView"
                read-only
                value="--"
              ></calcite-input>

              <span class="flag-name">hasFullGeometries</span>
              <calcite-input
                class="flag-value"
                id="flag-hasFullGeometries"
                read-only
                value="--"
              ></calcite-input>

              <span class="flag-name">availableFields</span>
              <calcite-input
                class="flag-value"
                id="flag-availableFields"
                read-only
                value="--"
              ></calcite-input>
            </div>

            <calcite-label id="transitionHeader"
              >Transition order</calcite-label
            >
            <ul id="transitionList"></ul>
            <div id="transitionControls">
              <calcite-button
                id="clearTransitions"
                appearance="outline"
                scale="s"
                >Clear</calcite-button
              >
            </div>
          </div>
        </calcite-panel>
        <arcgis-expand slot="top-left" mode="floating">
          <arcgis-legend></arcgis-legend>
        </arcgis-expand>
      </arcgis-map>
    </calcite-shell>
    <script type="module">
      const [Map, FeatureLayer, sql, reactiveUtils, promiseUtils, histogram] =
        await $arcgis.import([
          "@arcgis/core/Map.js",
          "@arcgis/core/layers/FeatureLayer.js",
          "@arcgis/core/core/sql.js",
          "@arcgis/core/core/reactiveUtils.js",
          "@arcgis/core/core/promiseUtils.js",
          "@arcgis/core/smartMapping/statistics/histogram.js",
        ]);

      let counter = 1;

      // set up a scale dependent display filter for rivers layer
      const layer = new FeatureLayer({
        portalItem: {
          id: "25e37d6a6c1649aab19af89331d102e0",
        },

        minScale: 0,
        maxScale: 0,
      });

      // get the arcgis-map component element and wait for it to be ready
      const viewElement = document.querySelector("arcgis-map");

      viewElement.map = new Map({
        basemap: "gray",
        layers: [layer],
      });
      viewElement.center = [-73.95, 40.73];
      viewElement.zoom = 12;

      // wait for the view element to be ready
      await viewElement.viewOnReady();

      // get the layer view for the rivers layer
      const layerView = await viewElement.whenLayerView(layer);

      const dateSlider = document.querySelector("arcgis-slider");
      const dateHistogram = document.querySelector("arcgis-histogram");
      const layerFeatureCountInput =
        document.querySelector("#layerFeatureCount");
      const featureCountInput = document.querySelector("#featureCount");
      const transitionList = document.querySelector("#transitionList");
      const clearTransitionsButton =
        document.querySelector("#clearTransitions");
      const flagInputs = {
        hasAllFeatures: document.querySelector("#flag-hasAllFeatures"),
        hasAllFeaturesInView: document.querySelector(
          "#flag-hasAllFeaturesInView"
        ),
        hasFullGeometries: document.querySelector("#flag-hasFullGeometries"),
        availableFields: document.querySelector("#flag-availableFields"),
      };
      const numberFormat = new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 0,
      });
      const shortDateFormatter = new Intl.DateTimeFormat("en-US", {
        dateStyle: "short",
      });
      const trackedProps = ["updating", "dataUpdating"];
      const previousValues = {
        updating: layerView.updating,
        dataUpdating: layerView.dataUpdating,
      };

      dateSlider.labelFormatter = (value) => {
        const asNumber = Number(value);
        if (!Number.isFinite(asNumber)) {
          return "--";
        }
        return shortDateFormatter.format(new Date(asNumber));
      };

      clearTransitionsButton.addEventListener("click", () => {
        transitionList.innerHTML = "";
      });

      await initializeCreatedDateFilter();
      updateLayerFeatureCount();

      reactiveUtils.watch(
        () => layerView.dataUpdating,
        (value) => {
          if (value) {
            featureCountInput.loading = true;
          } else {
            updateFeatureCount().then(
              () => {
                featureCountInput.loading = false;
              },
              () => {}
            );
          }
        }
      );

      const updateFeatureCount = promiseUtils.debounce(async () => {
        // query for the number of features intersecting the current view
        const query = layerView.createQuery();
        const count = await layerView.queryFeatureCount(query);
        featureCountInput.value = numberFormat.format(count);
      });

      async function updateLayerFeatureCount() {
        try {
          const count = await layer.queryFeatureCount();
          layerFeatureCountInput.value = numberFormat.format(count);
        } catch (error) {
          layerFeatureCountInput.value = "--";
        }
      }

      async function initializeCreatedDateFilter() {
        try {
          const histogramResult = await histogram({
            layer,
            field: "Created_Date",
            view: viewElement.view,
            numBins: 60,
          });

          const minValue = Math.floor(histogramResult.minValue);
          const maxValue = Math.ceil(histogramResult.maxValue);

          dateSlider.min = minValue;
          dateSlider.max = maxValue;
          dateSlider.values = [minValue, maxValue];

          dateHistogram.min = minValue;
          dateHistogram.max = maxValue;
          dateHistogram.bins = histogramResult.bins;

          const applyFilter = () => {
            const [minDate, maxDate] = dateSlider.values;
            applyCreatedDateFilter(minDate, maxDate);
          };

          const updateHistogramColorStops = () => {
            const [minDate, maxDate] = getSliderValues();
            dateHistogram.colorStops = [
              {
                minValue: minDate,
                maxValue: maxDate,
              },
            ];
          };

          dateSlider.addEventListener("arcgisInput", updateHistogramColorStops);
          dateSlider.addEventListener("arcgisChange", applyFilter);

          updateHistogramColorStops();
          applyCreatedDateFilter(minValue, maxValue);
        } catch (error) {
          console.error("Failed to initialize Created_Date histogram", error);
        }
      }

      function getSliderValues() {
        const rawValues = dateSlider.values;

        if (Array.isArray(rawValues) && rawValues.length === 2) {
          return rawValues.map((value) => Number(value));
        }

        if (typeof rawValues === "string") {
          const parsed = rawValues
            .split(",")
            .map((value) => Number(value.trim()));
          if (
            parsed.length === 2 &&
            parsed.every((value) => Number.isFinite(value))
          ) {
            return parsed;
          }
        }

        return [Number(dateSlider.min), Number(dateSlider.max)];
      }

      function applyCreatedDateFilter(minDate, maxDate) {
        const min = Math.floor(minDate);
        const max = Math.ceil(maxDate);
        layer.definitionExpression = `Created_Date >= ${sql.sqlTimestampLiteral(
          min
        )} AND Created_Date <= ${sql.sqlTimestampLiteral(max)}`;
        updateLayerFeatureCount();
      }

      // keep the flag UI in sync with layerview properties
      const flagProps = [
        "hasAllFeatures",
        "hasAllFeaturesInView",
        "hasFullGeometries",
        "availableFields",
      ];

      flagProps.forEach((prop) => {
        reactiveUtils.watch(
          () => layerView[prop],
          (value) => updateFlag(prop, value),
          { initial: true }
        );
      });

      trackedProps.forEach((prop) => {
        reactiveUtils.watch(
          () => layerView[prop],
          (value) => {
            if (value === previousValues[prop]) return;
            previousValues[prop] = value;
            appendTransition(prop, value);
          },
          { initial: true }
        );
      });

      function updateFlag(prop, value) {
        const input = flagInputs[prop];
        if (!input) return;

        if (prop === "availableFields") {
          const list = Array.isArray(value) ? value : [];
          input.value = list.length ? list.join(", ") : "--";
          return;
        }

        if (value === undefined) {
          input.value = "--";
          return;
        }

        const boolVal = value === true;
        input.value = String(value);
      }

      function appendTransition(prop, value) {
        const row = document.createElement("li");
        row.textContent = `#${counter++} ${prop} -> ${value}`;
        row.classList.add("latest", value ? "row-true" : "row-false");

        const previousLatest = transitionList.querySelector("li.latest");
        if (previousLatest) {
          previousLatest.classList.remove("latest");
        }

        transitionList.prepend(row);

        while (transitionList.children.length > 10) {
          transitionList.removeChild(transitionList.lastChild);
        }
      }
    </script>
  </body>
</html>
